
name: Add ABOUT buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-about:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add ABOUT buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          for filename, game in targets.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              marker = (
                  '"ホーム画面に追加"]})]}),'
                  'o.jsxs("section",{className:"panel settings-panel"'
              )

              link = (
                  f'"ホーム画面に追加"]}),'
                  f'o.jsx("a",{{className:"secondary",'
                  f'href:"../about.html?from={game}",'
                  f'children:"ABOUT"}})]}}),'
                  f'o.jsxs("section",{{className:"panel settings-panel"'
              )

              if f"../about.html?from={game}" in source:
                  print(f"{game}: 追加済み")
                  continue

              count = source.count(marker)

              if count != 1:
                  raise RuntimeError(
                      f"{game}: 目印が{count}個です。変更を中止します"
                  )

              source = source.replace(marker, link, 1)
              path.write_text(source, encoding="utf-8")
              print(f"{game}: ABOUT追加完了")

          PY

      - name: Validate JavaScript
        run: |
          node --check physica/assets/index-CKYAsxQ2.js
          node --check chemica/assets/index-BXyANL5z.js
          node --check biotica/assets/index-e84-tVCE.js

      - name: Verify all links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          for filename, game in targets.items():
              source = Path(filename).read_text(encoding="utf-8")
              link = f"../about.html?from={game}"

              if source.count(link) != 1:
                  raise RuntimeError(f"{game}: ABOUTリンク確認失敗")

              print(f"{game}: OK")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            physica/assets/index-CKYAsxQ2.js \
            chemica/assets/index-BXyANL5z.js \
            biotica/assets/index-e84-tVCE.js

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "Add ABOUT buttons to all games"
            git pull --rebase origin main
            git push origin main
          fi
