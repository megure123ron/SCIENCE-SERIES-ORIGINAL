
name: Polish settings ABOUT layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move ABOUT and remove explanation panel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          for filename, game in targets.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              old = (
                  f'o.jsx("a",{{className:"secondary",href:"../about.html?from={game}",'
                  'children:"ABOUT"})'
              )
              new = (
                  f'o.jsx("a",{{className:"secondary",'
                  'style:{display:"block",marginTop:"8px"},'
                  f'href:"../about.html?from={game}",children:"ABOUT"}})'
              )

              if source.count(new) == 1:
                  print(f"{game}: ABOUT already adjusted")
              else:
                  if source.count(old) != 1:
                      raise RuntimeError(f"{game}: ABOUT link not found uniquely")
                  source = source.replace(old, new, 1)

              start_token = (
                  ',o.jsxs("section",{className:"panel settings-panel",'
                  'children:[o.jsx("h2",{children:"学習設計と出典"})'
              )
              end_token = ']})]})}class B1'

              if source.count(start_token) != 1:
                  raise RuntimeError(f"{game}: explanation panel start not unique")

              start = source.index(start_token)
              end = source.find(end_token, start)

              if end < 0:
                  raise RuntimeError(f"{game}: explanation panel end not found")

              source = source[:start] + source[end + 3:]
              path.write_text(source, encoding="utf-8")
              print(f"{game}: updated")

          PY

      - name: Validate
        run: |
          node --check physica/assets/index-CKYAsxQ2.js
          node --check chemica/assets/index-BXyANL5z.js
          node --check biotica/assets/index-e84-tVCE.js

          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          for filename, game in targets.items():
              source = Path(filename).read_text(encoding="utf-8")
              assert source.count(f'about.html?from={game}') == 1
              assert 'children:"学習設計と出典"' not in source
              print(f"{game}: verified")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            physica/assets/index-CKYAsxQ2.js \
            chemica/assets/index-BXyANL5z.js \
            biotica/assets/index-e84-tVCE.js

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "Polish settings ABOUT layout"
            git pull --rebase origin main
            git push origin main
          fi
