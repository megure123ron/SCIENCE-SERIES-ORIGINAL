
name: Add ABOUT Buttons to All Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-about:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add ABOUT buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          for filename, game in targets.items():
              path = Path(filename)

              if not path.exists():
                  raise RuntimeError(f"ファイルがありません: {filename}")

              source = path.read_text(encoding="utf-8")

              about = f'o.jsx("a",{{className:"secondary",href:"../about.html?from={game}",children:"ABOUT"}})'

              if about in source:
                  print(f"{game}: ABOUTボタンは追加済み")
                  continue

              # 「ホーム画面に追加」を含むボタン要素を探す
              pattern = r'o\.jsx\("button",\{className:"secondary",onClick:.*?children:\[.*?"ホーム画面に追加"\]\}\)'

              matches = list(re.finditer(pattern, source))

              if len(matches) != 1:
                  print(f"{game}: ボタン候補数 = {len(matches)}")
                  pos = source.find("ホーム画面に追加")
                  if pos >= 0:
                      print(source[max(0, pos-400):pos+400])
                  raise RuntimeError(f"{game}: 対象ボタンを特定できません")

              match = matches[0]
              source = source[:match.end()] + "," + about + source[match.end():]

              path.write_text(source, encoding="utf-8")
              print(f"{game}: ABOUTボタンを追加しました")

          PY

      - name: Validate JavaScript
        run: |
          for file in \
            physica/assets/index-CKYAsxQ2.js \
            chemica/assets/index-BXyANL5z.js \
            biotica/assets/index-e84-tVCE.js
          do
            node --check "$file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add physica chemica biotica
          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "Add ABOUT buttons to all games"
            git push origin main
          else
            echo "変更はありません"
          fi
