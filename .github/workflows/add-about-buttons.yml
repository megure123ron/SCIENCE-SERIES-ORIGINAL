
name: Add ABOUT Buttons to All Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-about:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Insert ABOUT buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          old = 'o.jsxs("button",{className:"secondary",onClick:()=>c(!0),children:[o.jsx(he,{name:"install"}),"ホーム画面に追加"]})'

          for filename, game in targets.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              link = (
                  f'o.jsx("a",{{className:"secondary",'
                  f'href:"../about.html?from={game}",'
                  f'children:"ABOUT"}})'
              )

              if source.count(link) > 0:
                  print(f"{game}: ABOUT追加済み")
                  continue

              count = source.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{game}: 設定ボタンの一致数が{count}です。変更を中止します。"
                  )

              source = source.replace(old, old + "," + link, 1)

              if source.count(link) != 1:
                  raise RuntimeError(f"{game}: ABOUT追加の検証に失敗")

              path.write_text(source, encoding="utf-8")
              print(f"{game}: ABOUT追加成功")

          PY

      - name: Validate JavaScript
        run: |
          for file in \
            physica/assets/index-CKYAsxQ2.js \
            chemica/assets/index-BXyANL5z.js \
            biotica/assets/index-e84-tVCE.js
          do
            node --check "$file"
          done

      - name: Verify changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          for filename, game in targets.items():
              source = Path(filename).read_text(encoding="utf-8")
              link = f'about.html?from={game}'

              assert source.count(link) == 1, f"{game}: ABOUTリンク検証失敗"

              print(f"{game}: 検証OK")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            physica/assets/index-CKYAsxQ2.js \
            chemica/assets/index-BXyANL5z.js \
            biotica/assets/index-e84-tVCE.js

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "Add ABOUT buttons to all games"
            git pull --rebase origin main
            git push origin main
          else
            echo "変更はありません"
          fi
