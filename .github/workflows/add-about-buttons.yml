
name: Add ABOUT buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-about:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Insert ABOUT buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          old = (
              'o.jsxs("button",{className:"secondary",'
              'onClick:()=>c(!0),'
              'children:[o.jsx(he,{name:"install"}),"ホーム画面に追加"]})'
          )

          for filename, game in targets.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              url = f"../about.html?from={game}"

              if url in source:
                  print(f"{game}: already added")
                  continue

              count = source.count(old)
              print(f"{game}: target count = {count}")

              if count != 1:
                  raise RuntimeError(
                      f"{game}: expected exactly 1 target, found {count}"
                  )

              new = (
                  old
                  + ',o.jsx("a",{className:"secondary",'
                  + f'href:"{url}",'
                  + 'children:"ABOUT"})'
              )

              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
              print(f"{game}: ABOUT inserted")

          PY

      - name: Validate JavaScript
        run: |
          node --check physica/assets/index-CKYAsxQ2.js
          node --check chemica/assets/index-BXyANL5z.js
          node --check biotica/assets/index-e84-tVCE.js

      - name: Verify links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "physica/assets/index-CKYAsxQ2.js": "physica",
              "chemica/assets/index-BXyANL5z.js": "chemica",
              "biotica/assets/index-e84-tVCE.js": "biotica",
          }

          for filename, game in targets.items():
              source = Path(filename).read_text(encoding="utf-8")
              url = f"../about.html?from={game}"

              if source.count(url) != 1:
                  raise RuntimeError(f"{game}: link verification failed")

              print(f"{game}: verified")

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            physica/assets/index-CKYAsxQ2.js \
            chemica/assets/index-BXyANL5z.js \
            biotica/assets/index-e84-tVCE.js

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "Add ABOUT buttons to all games"
            git pull --rebase origin main
            git push origin main
          fi
