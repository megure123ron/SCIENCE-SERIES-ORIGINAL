
name: Refresh game cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh all game caches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          games = {
              "physica": "index-CKYAsxQ2.js",
              "chemica": "index-BXyANL5z.js",
              "biotica": "index-e84-tVCE.js",
          }

          version = "20261123-3"

          for game, js in games.items():
              html = Path(game, "index.html")
              source = html.read_text(encoding="utf-8")
              pattern = r'(\./assets/' + re.escape(js) + r')(?:\?v=[^"]*)?'
              source, count = re.subn(
                  pattern, lambda m: m.group(1) + "?v=" + version,
                  source
              )
              if count != 1:
                  raise RuntimeError(f"{game}: HTML script reference count={count}")
              html.write_text(source, encoding="utf-8")

              sw = Path(game, "sw.js")
              source = sw.read_text(encoding="utf-8")

              source, count = re.subn(
                  r"const CACHE='([^']+)-v\d+-([^']+)';",
                  lambda m: f"const CACHE='{m.group(1)}-v13-{m.group(2)}-{version}';",
                  source, count=1
              )
              if count != 1:
                  raise RuntimeError(f"{game}: cache version not found")

              pattern = r'("\./assets/' + re.escape(js) + r')(?:\?v=[^"]*)?(")'
              source, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + "?v=" + version + m.group(2),
                  source
              )
              if count != 1:
                  raise RuntimeError(f"{game}: precache JS reference count={count}")

              sw.write_text(source, encoding="utf-8")
              print(f"{game}: cache refreshed")

          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          games = {
              "physica": "index-CKYAsxQ2.js",
              "chemica": "index-BXyANL5z.js",
              "biotica": "index-e84-tVCE.js",
          }

          for game, js in games.items():
              html = Path(game, "index.html").read_text()
              sw = Path(game, "sw.js").read_text()
              assert js + "?v=20261123-3" in html
              assert js + "?v=20261123-3" in sw
              assert "-v13-" in sw
              print(game, "OK")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add physica/index.html physica/sw.js chemica/index.html chemica/sw.js biotica/index.html biotica/sw.js
          git diff --cached --check
          git commit -m "Refresh game asset cache"
          git pull --rebase origin main
          git push origin main
